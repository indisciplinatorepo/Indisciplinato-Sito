<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon-32.png" type="image/png">
<title>Gestionale Indisciplinato 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Palette Indisciplinato (Dusk Blue, Mint Leaf, Tomato) su carta chiara. Layout: barra in alto con 4 sezioni, sommario prima del dettaglio, schede a griglia. */
:root{
  --paper:#f6f5f1; --card:#ffffff; --ink:#1b2233; --muted:#5a6275; --line:#dcdad3;
  --blue:#345995; --on-blue:#ffffff; --mint:#03cea4; --mint-soft:#d6f5ee; --tomato:#fb4d3d; --tomato-soft:#fde3e0;
  --amber:#b7791f; --amber-soft:#fbefd9; --ok:#0f7a5f;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141a26; --card:#1c2433; --ink:#eef1f6; --muted:#aab2c3; --line:#2f3a4f;
  --blue:#9fb8e6; --on-blue:#141a26; --mint-soft:#11392f; --tomato-soft:#3e1d1b; --amber:#e7b562; --amber-soft:#3a2d14; --ok:#4fd6ae; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#141a26; --card:#1c2433; --ink:#eef1f6; --muted:#aab2c3; --line:#2f3a4f;
  --blue:#9fb8e6; --on-blue:#141a26; --mint-soft:#11392f; --tomato-soft:#3e1d1b; --amber:#e7b562; --amber-soft:#3a2d14; --ok:#4fd6ae; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{background:var(--blue);color:var(--on-blue)}
.top .in{max-width:1180px;margin:0 auto;padding:18px 16px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{font:800 clamp(26px,5vw,38px)/1 var(--display);margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--mint)}
:root[data-theme="dark"] .brand h1 span{color:#0b6b57}
.brand p{margin:0;font-size:14px;opacity:.9}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav a{color:var(--on-blue);text-decoration:none;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;white-space:nowrap;opacity:.85}
nav a[aria-current="page"]{background:var(--paper);color:var(--ink);opacity:1}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h2{font:800 26px/1.1 var(--display);margin:0;text-wrap:balance}
h3{font:700 19px/1.2 var(--display);margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.bar:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font:800 28px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.accent{border-left:6px solid var(--mint)}
.tile.warn{border-left:6px solid var(--tomato)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--mint);border-radius:99px}
.meter i.over{background:var(--tomato)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--card);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cat td{background:var(--paper);font-weight:700}
tr.cat td .meter{max-width:220px}
tr.tot td{font-weight:700;border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb,var(--mint) 8%,transparent)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--mint-soft);color:var(--ok)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--tomato-soft);color:var(--tomato)}
.chip.neu{background:transparent;color:var(--muted);border-color:var(--line)}
:root:not([data-theme="dark"]) .chip.bad{color:#b4261a}
.btn{font:700 15px var(--body);border-radius:10px;padding:10px 16px;border:2px solid var(--blue);background:var(--blue);color:var(--on-blue);cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.danger{background:transparent;border-color:var(--tomato);color:var(--tomato)}
.btn.small{padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:700 14px var(--body);background:var(--card);color:var(--ink);border:0;padding:8px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.search{max-width:320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--line)}
.card:hover{border-color:var(--blue)}
.card.wine{border-top-color:var(--tomato)}
.card.food{border-top-color:var(--mint)}
.card .z{font-size:14px;color:var(--muted)}
.card .p{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.group{margin-top:22px}
.group>h3{margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.group>h3 small{font:400 14px var(--body);color:var(--muted)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.status{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:14px;display:none}
.status.show{display:block}
.status.err{background:var(--tomato-soft)}
.contact{font-size:14px;line-height:1.6}
.contact b{font-weight:700}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
@media (min-width:700px){.ov{align-items:center}}
.dlg{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px 24px}
@media (min-width:700px){.dlg{border-radius:18px}}
.dlg header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);font-weight:400}
.check input{width:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.note time{font-weight:700;color:var(--muted);font-size:12px;display:block}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--ink);cursor:pointer;padding:2px 6px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid #f2b43c;border-radius:12px;padding:10px 14px;cursor:pointer}
.ev:hover{border-color:var(--blue)}
.ev.past{opacity:.6}
.ev.fiera{border-left-color:var(--tomato)}
.evd{display:flex;flex-direction:column;align-items:center;min-width:42px;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700}
.evd b{font:800 24px/1 var(--display);color:var(--ink)}
.evb{display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand">
    <h1>Indisciplinato <span>2027</span> · gestionale</h1>
    <p id="countdown">15–16 maggio 2027 · Palazzo del Michelerio, Asti</p>
  </div>
  <nav aria-label="Sezioni">
    <a href="#produttori" data-v="produttori">Produttori</a>
    <a href="#calendario" data-v="calendario">Calendario</a>
    <a href="#budget" data-v="budget">Budget</a>
    <a href="#spese" data-v="spese">Spese e fatture</a>
    <a href="#partner" data-v="partner">Partner</a>
  </nav>
</div></div>

<main>
  <div class="status" id="status" role="status"></div>
  <section id="v-produttori" hidden></section>
  <section id="v-calendario" hidden></section>
  <section id="v-budget" hidden></section>
  <section id="v-spese" hidden></section>
  <section id="v-partner" hidden></section>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const DRIVE_FOLDER = "19jCHtiW-Hzzzv-sZbnREOrRkzNtCQiCM";
const DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/" + DRIVE_FOLDER;
const API_URL = "https://script.google.com/macros/s/AKfycbyOEjvUSuB8NdsXgdqqn5JiaRNV-UACJ8xNVpfYAOHM8nGp89-FOZ9HYANSMfxJyng8/exec";
const EVENT = new Date("2027-05-15T11:00:00+02:00");

const S = {voci:[], spese:[], fonti:[], produttori:[], partner:[]};
const loaded = {};
let ready = false, sheetUrl = "";
let KEY = null;
(function(){
  const u = new URL(location.href); const k = u.searchParams.get("k");
  if(k){ KEY = k; try{ localStorage.setItem("gestionale_k", k); }catch(e){} u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.hash); }
  else { try{ KEY = localStorage.getItem("gestionale_k"); }catch(e){} }
})();
async function apiGet(extra){
  const r = await fetch(API_URL + "?k=" + encodeURIComponent(KEY||"") + (extra||""), {cache:"no-store"});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"errore"); return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, {method:"POST", body: JSON.stringify(Object.assign({}, body, {k:KEY}))});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"errore"); return j;
}
let view = "produttori";
const ui = {speseFonte:"", speseVoce:"", prodTipo:"tutti", prodArea:"tutte", prodQ:"", partQ:""};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => { const v=Number(n)||0; const [i,d]=Math.abs(v).toFixed(2).split("."); return (v<0?"−":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+d+" €"; };
const pl = (n, one, many) => n + " " + (n===1 ? one : many);
const num = v => { const n = parseFloat(String(v).replace(/\./g,"").replace(",", ".")); return isFinite(n) ? n : 0; };
const toNum = v => typeof v === "number" ? v : num(v);
const sum = (a, f) => a.reduce((t, x) => t + (toNum(f(x)) || 0), 0);
const byOrd = (a, b) => (a.ordine ?? 999) - (b.ordine ?? 999) || String(a.nome||a.desc||"").localeCompare(String(b.nome||b.desc||""));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3800); }
function status(msg, err){ const s=$("#status"); s.textContent=msg||""; s.classList.toggle("show",!!msg); s.classList.toggle("err",!!err); }

/* countdown */
(function(){ const d=Math.ceil((EVENT-new Date())/86400000); if(d>0) $("#countdown").textContent = `15–16 maggio 2027 · Palazzo del Michelerio, Asti · mancano ${d} giorni`; })();

/* ---------- routing ---------- */
const VIEWS = ["produttori","calendario","budget","spese","partner"];
function route(){
  const h = location.hash.replace("#","");
  view = VIEWS.includes(h) ? h : "produttori";
  document.querySelectorAll("nav a").forEach(a => { if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  VIEWS.forEach(v => $("#v-"+v).hidden = v!==view);
  if(view==="calendario" && !EV.loaded && ready) loadEventi();
  render();
}
window.addEventListener("hashchange", route);

/* ---------- calcoli ---------- */
const spentByVoce = id => sum(S.spese.filter(s=>s.voceId===id), s=>s.importo);
const spentByFonte = id => sum(S.spese.filter(s=>s.fonteId===id), s=>s.importo);
function fontePrevisto(f){
  if(f.auto === "quote") return (toNum(f.quotaUnit)||50) * S.produttori.length;
  return toNum(f.previsto);
}
function fonteIncassato(f){
  if(f.auto === "quote") return sum(S.produttori.filter(p=>p.quotaPagata), p=>p.quota ?? 50);
  return toNum(f.incassato);
}

/* ---------- BUDGET ---------- */
function renderBudget(){
  const el = $("#v-budget");
  const prev = sum(S.voci, v=>v.prev);
  const spent = sum(S.spese, s=>s.importo);
  const finanz = S.fonti.filter(f=>f.tipo!=="entrata");
  const entrate = S.fonti.filter(f=>f.tipo==="entrata");
  const fondiCerti = sum(finanz.filter(f=>f.stato==="confermato"), fontePrevisto);
  const fondiTot = sum(finanz, fontePrevisto);
  const entrateTot = sum(entrate, fontePrevisto);
  const rimanente = prev - spent;
  const pct = prev ? Math.min(100, spent/prev*100) : 0;
  const scopertoFin = prev - fondiTot;

  const cats = [...new Set(S.voci.map(v=>v.cat))];
  let rows = "";
  cats.forEach(c => {
    const vs = S.voci.filter(v=>v.cat===c).sort(byOrd);
    const cp = sum(vs, v=>v.prev), cs = sum(vs, v=>spentByVoce(v.id));
    const cpct = cp ? Math.min(100, cs/cp*100) : 0;
    rows += `<tr class="cat"><td>${esc(c)}<div class="meter" aria-hidden="true"><i class="${cs>cp?"over":""}" style="width:${cpct}%"></i></div></td><td class="n">${eur(cp)}</td><td class="n">${eur(cs)}</td><td class="n">${eur(cp-cs)}</td><td></td></tr>`;
    vs.forEach(v => {
      const s = spentByVoce(v.id), d = toNum(v.prev) - s;
      const amm = v.ammissibile === true ? '<span class="chip ok">ammissibile CRT</span>' : v.ammissibile === false ? '<span class="chip bad">non ammissibile CRT</span>' : '<span class="chip neu">da verificare</span>';
      const over = s > toNum(v.prev) ? ' <span class="chip bad">sopra preventivo</span>' : "";
      rows += `<tr class="click" data-voce="${esc(v.id)}" tabindex="0"><td>${esc(v.desc)}${v.qta?`<div class="hint">${esc(v.qta)}</div>`:""}</td><td class="n">${eur(v.prev)}</td><td class="n">${eur(s)}</td><td class="n">${eur(d)}</td><td>${amm}${over}</td></tr>`;
    });
  });

  let frows = "";
  const fRow = f => {
    const p = fontePrevisto(f), imp = spentByFonte(f.id);
    const st = f.stato==="confermato" ? '<span class="chip ok">confermato</span>' : f.stato==="atteso" ? '<span class="chip neu">atteso</span>' : '<span class="chip warn">da confermare</span>';
    return `<tr class="click" data-fonte="${esc(f.id)}" tabindex="0"><td>${esc(f.nome)}${f.note?`<div class="hint">${esc(f.note)}</div>`:""}</td><td class="n">${eur(p)}</td><td>${st}</td><td class="n">${f.tipo==="entrata"?eur(fonteIncassato(f)):eur(imp)}</td><td class="n">${f.tipo==="entrata"?"":eur(p-imp)}</td></tr>`;
  };
  frows += `<tr class="cat"><td colspan="5">Finanziamenti e cofinanziamenti</td></tr>` + finanz.sort(byOrd).map(fRow).join("");
  frows += `<tr class="tot"><td>Totale finanziamenti</td><td class="n">${eur(fondiTot)}</td><td></td><td class="n">${eur(sum(finanz,f=>spentByFonte(f.id)))}</td><td class="n">${eur(fondiTot-sum(finanz,f=>spentByFonte(f.id)))}</td></tr>`;
  frows += `<tr class="cat"><td colspan="5">Entrate dell'evento</td></tr>` + entrate.sort(byOrd).map(fRow).join("");
  frows += `<tr class="tot"><td>Totale entrate previste</td><td class="n">${eur(entrateTot)}</td><td></td><td class="n">${eur(sum(entrate,fonteIncassato))}</td><td></td></tr>`;

  el.innerHTML = `
  <div class="bar"><div><h2>A che punto siamo</h2><p class="hint">Costi dal budget presentato a Fondazione CRT (foglio "costi", aprile 2026). Lo speso arriva dalle spese registrate.${sheetUrl?` Tutti i dati sono anche nel <a href="${esc(sheetUrl)}" target="_blank" rel="noopener">foglio Google</a>.`:""}</p></div></div>
  <div class="tiles">
    <div class="tile"><div class="k">Costi previsti</div><div class="v">${eur(prev)}</div><div class="s">${S.voci.length} voci di spesa</div></div>
    <div class="tile accent"><div class="k">Speso finora</div><div class="v">${eur(spent)}</div><div class="meter"><i style="width:${pct}%"></i></div><div class="s">${pct.toFixed(0)}% del previsto · ${pl(S.spese.length,"spesa","spese")}</div></div>
    <div class="tile ${rimanente<0?"warn":""}"><div class="k">Ancora da spendere</div><div class="v">${eur(rimanente)}</div><div class="s">previsto meno speso</div></div>
    <div class="tile ${scopertoFin>0?"warn":"accent"}"><div class="k">Finanziamenti</div><div class="v">${eur(fondiTot)}</div><div class="s">${eur(fondiCerti)} confermati · ${scopertoFin>0?`mancano ${eur(scopertoFin)} da coprire con le entrate`:"costi coperti"}</div></div>
  </div>

  <div class="bar"><div><h3>Chi paga</h3><p class="hint">Tocca una riga per aggiornare importo o stato. "Speso" è la somma delle spese assegnate a quel finanziatore.</p></div><button class="btn ghost small" id="addFonte">+ Fonte</button></div>
  <div class="tablewrap"><table><thead><tr><th>Fonte</th><th class="n">Previsto</th><th>Stato</th><th class="n">Speso / incassato</th><th class="n">Residuo</th></tr></thead><tbody>${frows}</tbody></table></div>

  <div class="bar"><div><h3>Voci di spesa</h3><p class="hint">Preventivo e speso reale per voce. Tocca una voce per modificarla.</p></div><button class="btn ghost small" id="addVoce">+ Voce</button></div>
  <div class="tablewrap"><table><thead><tr><th>Voce</th><th class="n">Preventivo</th><th class="n">Speso</th><th class="n">Differenza</th><th>Note</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="hint">Nessuna voce ancora.</td></tr>`}
  <tr class="tot"><td>Totale</td><td class="n">${eur(prev)}</td><td class="n">${eur(spent)}</td><td class="n">${eur(rimanente)}</td><td></td></tr></tbody></table></div>`;

  el.querySelectorAll("[data-voce]").forEach(r => { r.onclick = () => editVoce(S.voci.find(v=>v.id===r.dataset.voce)); r.onkeydown = e => { if(e.key==="Enter") r.onclick(); }; });
  el.querySelectorAll("[data-fonte]").forEach(r => { r.onclick = () => editFonte(S.fonti.find(v=>v.id===r.dataset.fonte)); r.onkeydown = e => { if(e.key==="Enter") r.onclick(); }; });

    <div class="full"><label for="s_note">Note</label><input id="s_note" value="${esc(s.note||"")}"></div>
   </div>`, async (setMsg) => {
    const data = {...strip(s), data:$("#s_data").value, importo:num($("#s_imp").value), fornitore:$("#s_forn").value.trim(), descrizione:$("#s_desc").value.trim(), voceId:$("#s_voce").value, fonteId:$("#s_fonte").value, pagamento:$("#s_pag").value, note:$("#s_note").value.trim()};

    const file = $("#s_file").files[0];
    if(file){
      setMsg("Carico il documento su Google Drive…");
      const up = await uploadToDrive(file, data);
      if(up.error) return up.error;

    toast(file ? "Spesa salvata e documento caricato su Drive." : "Spesa salvata.");
  }, isNew ? null : async () => { await del("spese", s.id); });
}

async function uploadToDrive(file, d){
  if(file.size > 15*1024*1024) return {error:"Il file supera 15 MB: riducilo o fotografalo a risoluzione più bassa."};
  const ext = (file.name.split(".").pop()||"pdf").toLowerCase();
  const name = `${d.data}_${slug(d.fornitore)}_${toNum(d.importo).toFixed(2).replace(".",",")}EUR.${ext}`;
  const type = file.type || (ext==="pdf"?"application/pdf":"image/jpeg");
  try {
    const buf = new Uint8Array(await file.arrayBuffer()); let bin=""; for(let i=0;i<buf.length;i+=0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
    const j = await apiPost({action:"upload", file:{name, type, base64:btoa(bin)}});
    return {driveId:j.driveId, driveUrl:j.driveUrl, fileName:j.fileName};
  } catch(e){
    return {error:"Caricamento su Drive non riuscito (" + (e && e.message || "errore di rete") + "). Controlla nella cartella se il file c'è già prima di riprovare."};
  }
}

      <div class="contact">${p.referente?`<div><b>${esc(p.referente)}</b></div>`:""}${p.telefono?`<div>${esc(p.telefono)}</div>`:""}${p.email?`<div>${esc(p.email)}</div>`:""}</div>
      <div class="chips">${p.protocollo?'<span class="chip ok">protocollo firmato</span>':""}${(p.diario||[]).length?`<span class="chip neu">${p.diario.length} note · ultima ${fmtDate(last.data)}</span>`:""}${!p.telefono&&!p.email?'<span class="chip warn">contatti da completare</span>':""}</div></button>`;
  };
  let html="";
  PCAT.forEach(c => { const g=list.filter(p=>(p.categoria||"Altri contatti")===c).sort(byOrd); if(g.length) html += `<div class="group"><h3>${c} <small>${g.length}</small></h3><div class="grid">${g.map(card).join("")}</div></div>`; });
  el.innerHTML = `
  <div class="bar"><div><h2>Partner e contatti</h2><p class="hint">Rubrica delle realtà coinvolte: ruolo, referente, protocollo e diario degli incontri.</p></div><button class="btn" id="addPart">+ Aggiungi contatto</button></div>
  <div class="bar" style="margin-top:0"><input class="search" id="paq" type="search" placeholder="Cerca nome, ruolo, referente…" value="${esc(ui.partQ)}" aria-label="Cerca partner"></div>
  ${html || `<div class="empty">Nessun contatto trovato.</div>`}`;
  $("#addPart").onclick = () => editPart(null);
  const paq=$("#paq"); paq.oninput = e => { ui.partQ=e.target.value; render(); const n=$("#paq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  el.querySelectorAll("[data-pa]").forEach(b => b.onclick = () => editPart(S.partner.find(p=>p.id===b.dataset.pa)));
}

function editPart(p){
  const isNew = !p; p = p || {nome:"", categoria:"Partner di progetto", diario:[]};
  const f = (id,label,val,ph="",full=false) => `<div class="${full?"full":""}"><label for="${id}">${label}</label><input id="${id}" value="${esc(val||"")}" placeholder="${esc(ph)}"></div>`;
  const notes = (p.diario||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  openDlg(isNew?"Nuovo contatto":esc(p.nome), `
   <div class="form">
    ${f("a_nome","Nome",p.nome,"",true)}
    <div><label for="a_cat">Categoria</label><select id="a_cat">${PCAT.map(c=>`<option ${c===p.categoria?"selected":""}>${c}</option>`).join("")}</select></div>
    ${f("a_ref","Referente",p.referente)}
    ${f("a_ruolo","Ruolo nel progetto",p.ruolo,"es. formazione volontari",true)}
    ${f("a_tel","Telefono",p.telefono)}
    ${f("a_mail","Email",p.email)}
    ${f("a_prot","Link al protocollo / preventivo",p.protocollo,"https://drive.google.com/…",true)}
    ${p.protocollo?`<p class="full hint"><a href="${esc(p.protocollo)}" target="_blank" rel="noopener">Apri il documento</a></p>`:""}
    <div class="full"><label for="a_info">Informazioni utili</label><textarea id="a_info">${esc(p.info||"")}</textarea></div>
    <div class="full"><label for="a_nn">Diario incontri: aggiungi una nota</label>
      <div class="row" style="flex-wrap:nowrap"><input id="a_nd" type="date" value="${today()}" style="max-width:170px" aria-label="Data della nota"><input id="a_nn" placeholder="es. Incontro in sede: confermano 2 volontari"></div>
      <div class="notes">${notes.map(n=>`<div class="note"><time>${fmtDate(n.data)}</time>${esc(n.testo)}</div>`).join("") || '<p class="hint">Nessuna nota ancora.</p>'}</div></div>
   </div>`, async () => {
    const diario = (p.diario||[]).slice(); const nn=$("#a_nn").value.trim(); if(nn) diario.push({data:$("#a_nd").value||today(), testo:nn});
    const data = {...strip(p), nome:$("#a_nome").value.trim(), categoria:$("#a_cat").value, referente:$("#a_ref").value.trim(), ruolo:$("#a_ruolo").value.trim(), telefono:$("#a_tel").value.trim(), email:$("#a_mail").value.trim(), protocollo:$("#a_prot").value.trim(), info:$("#a_info").value.trim(), diario};
    if(!data.nome) return "Scrivi il nome.";
    await save("partner", p.id, data);
  }, isNew ? null : async () => { await del("partner", p.id); });
}

/* ---------- CALENDARIO ---------- */
const EV = {list:[], loaded:false, loading:false, err:"", passati:false};
async function loadEventi(){
  if(EV.loading) return; EV.loading = true; render();
  try { const j = await apiGet("&action=eventi"); EV.list = j.eventi || []; EV.loaded = true; EV.err = ""; }
  catch(e){ EV.err = e && e.message === "chiave" ? "Link non valido." : "Non riesco a leggere il calendario (" + (e && e.message || "errore di rete") + "). Se hai appena aggiornato lo script, controlla di aver creato la nuova versione della distribuzione."; }
  EV.loading = false; render();
}
const GG = ["dom","lun","mar","mer","gio","ven","sab"];
function evDay(ev){ return ev.inizio.slice(0,10); }
function evTime(ev){
  if(ev.tuttoIlGiorno) return ev.fine && ev.fine!==ev.inizio ? "fino al " + fmtDate(ev.fine) : "tutto il giorno";
  const t = ev.inizio.slice(11,16), f = ev.fine ? ev.fine.slice(11,16) : "";
  return f && f!==t ? `${t}–${f}` : t;
}
function renderCalendario(){
  const el = $("#v-calendario");
  const oggi = today();
  const list = EV.list.filter(ev => EV.passati ? true : (ev.tuttoIlGiorno ? (ev.fine||ev.inizio) : ev.inizio.slice(0,10)) >= oggi).sort((a,b)=>a.inizio.localeCompare(b.inizio));
  const prossimo = EV.list.filter(ev => evDay(ev) >= oggi).sort((a,b)=>a.inizio.localeCompare(b.inizio))[0];
  const months = {};
  list.forEach(ev => { const m = evDay(ev).slice(0,7); (months[m] = months[m] || []).push(ev); });
  let html = "";
  Object.keys(months).forEach(m => {
    const d = new Date(m + "-01T12:00:00");
    html += `<div class="group"><h3>${d.toLocaleDateString("it-IT",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase())} <small>${pl(months[m].length,"evento","eventi")}</small></h3><div class="evlist">` +
      months[m].map(ev => { const dd = new Date(evDay(ev)+"T12:00:00"); const past = evDay(ev) < oggi; const fiera = /indisciplinato/i.test(ev.titolo) && /fiera|evento|2027/i.test(ev.titolo);
        return `<button class="ev ${past?"past":""} ${fiera?"fiera":""}" data-ev="${esc(ev.id)}"><span class="evd"><b>${dd.getDate()}</b>${GG[dd.getDay()]}</span><span class="evb"><b>${esc(ev.titolo)}</b><span class="hint">${esc(evTime(ev))}${ev.luogo?" · "+esc(ev.luogo):""}</span></span></button>`; }).join("") + `</div></div>`;
  });
  el.innerHTML = `
  <div class="bar"><div><h2>Calendario</h2><p class="hint">Gli eventi aggiunti qui finiscono nel calendario Google <b>INDISCIPLINATO</b> e arrivano a tutti quelli che lo seguono.</p></div><button class="btn" id="addEv" ${ready?"":"disabled"}>+ Aggiungi evento</button></div>
  <div class="tiles">
    <div class="tile accent"><div class="k">Prossimo appuntamento</div><div class="v" style="font-size:22px">${prossimo?esc(prossimo.titolo):"—"}</div><div class="s">${prossimo?fmtDate(evDay(prossimo))+" · "+esc(evTime(prossimo)):"nessun evento in programma"}</div></div>
    <div class="tile"><div class="k">Alla fiera</div><div class="v">${Math.max(0,Math.ceil((EVENT-new Date())/86400000))} giorni</div><div class="s">15–16 maggio 2027</div></div>
  </div>
  <div class="bar"><div class="seg" role="group" aria-label="Periodo"><button data-pp="0" aria-pressed="${!EV.passati}">Da oggi</button><button data-pp="1" aria-pressed="${EV.passati}">Anche ultimi 30 giorni</button></div><button class="btn ghost small" id="reloadEv">Aggiorna</button></div>
  ${EV.err ? `<div class="empty" role="alert">${esc(EV.err)}</div>` : EV.loading && !EV.loaded ? `<div class="empty">Carico il calendario…</div>` : html || `<div class="empty">Nessun evento in calendario. Premi “Aggiungi evento” per inserire una riunione o una scadenza.</div>`}`;
  $("#addEv").onclick = () => editEvento();
  $("#reloadEv").onclick = () => loadEventi();
  el.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => { EV.passati = b.dataset.pp==="1"; render(); });
  el.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => showEvento(EV.list.find(e=>e.id===b.dataset.ev)));
}
function showEvento(ev){
  openDlg(esc(ev.titolo), `<div class="contact"><p><b>${fmtDate(evDay(ev))}</b> · ${esc(evTime(ev))}</p>${ev.luogo?`<p>📍 ${esc(ev.luogo)}</p>`:""}${ev.note?`<p style="white-space:pre-wrap">${esc(ev.note)}</p>`:""}${ev.ricorrente?'<p class="hint">Evento ricorrente: si modifica solo da Google Calendar.</p>':""}</div>`,
    async () => {}, ev.ricorrente ? null : async () => { await apiPost({action:"eliminaEvento", id:ev.id}); EV.list = EV.list.filter(x=>x.id!==ev.id); render(); });
  $("#dlgSave").textContent = "Chiudi";
}
function editEvento(){
  let autore = ""; try { autore = localStorage.getItem("gestionale_nome") || ""; } catch(e){}
  openDlg("Nuovo evento", `
   <div class="form">
    <div class="full"><label for="e_tit">Titolo</label><input id="e_tit" placeholder="es. Riunione organizzativa"></div>
    <div><label for="e_data">Data</label><input id="e_data" type="date" value="${today()}"></div>
    <div><label class="check" style="margin-top:26px"><input type="checkbox" id="e_all"> Tutto il giorno</label></div>
    <div class="ora"><label for="e_ora">Ora inizio</label><input id="e_ora" type="time" value="18:00"></div>
    <div class="ora"><label for="e_oraf">Ora fine</label><input id="e_oraf" type="time" value="19:30"></div>
    <div class="full alld" hidden><label for="e_df">Ultimo giorno (se dura più giorni)</label><input id="e_df" type="date"></div>
    <div class="full"><label for="e_luogo">Luogo o link della call</label><input id="e_luogo" placeholder="es. Diavolo Rosso, Asti"></div>
    <div class="full"><label for="e_note">Note</label><textarea id="e_note" placeholder="ordine del giorno, cosa portare…"></textarea></div>
    <div class="full"><label for="e_aut">Il tuo nome</label><input id="e_aut" value="${esc(autore)}" placeholder="così il team sa chi l'ha inserito"></div>
   </div>`, async (setMsg) => {
    const all = $("#e_all").checked;
    const e = {titolo:$("#e_tit").value.trim(), data:$("#e_data").value, tuttoIlGiorno:all, ora:$("#e_ora").value, oraFine:$("#e_oraf").value, dataFine: all ? $("#e_df").value : "", luogo:$("#e_luogo").value.trim(), note:$("#e_note").value.trim(), autore:$("#e_aut").value.trim()};
    if(!e.titolo || !e.data) return "Servono almeno titolo e data.";
    if(!all && e.oraFine && e.oraFine <= e.ora) return "L'ora di fine deve essere dopo l'inizio.";
    try { localStorage.setItem("gestionale_nome", e.autore); } catch(x){}
    setMsg("Inserisco nel calendario INDISCIPLINATO…");
    await apiPost({action:"evento", evento:e});
    toast("Evento aggiunto al calendario INDISCIPLINATO.");
    loadEventi();
  });
  const sync = () => { const all=$("#e_all").checked; document.querySelectorAll(".ora").forEach(x=>x.hidden=all); $(".alld").hidden=!all; };
  $("#e_all").onchange = sync;
}

/* ---------- dialog + salvataggio ---------- */
function strip(o){ const c={...o}; delete c.id; return c; }
async function save(col, id, data){
  const j = await apiPost({action:"set", col, id, data});
  const nid = id || j.id; const i = S[col].findIndex(x=>x.id===nid);
  if(i>=0) S[col][i] = {id:nid, ...data}; else S[col].push({id:nid, ...data});
  render(); refresh();
}
async function del(col, id){
  await apiPost({action:"delete", col, id});
  S[col] = S[col].filter(x=>x.id!==id); render(); refresh();
}

function openDlg(title, body, onSave, onDelete){
  const d=$("#dlg");
  d.innerHTML = `<header><h2 id="dlgTitle">${title}</h2><button class="x" aria-label="Chiudi">×</button></header>${body}
   <p class="hint" id="dlgMsg" role="alert"></p>
   <div class="acts"><div>${onDelete?'<button class="btn danger" id="dlgDel">Elimina</button>':""}</div><div class="row"><button class="btn ghost" id="dlgCancel">Annulla</button><button class="btn" id="dlgSave" ${ready?"":"disabled"}>Salva</button></div></div>`;
  $("#ov").classList.add("open");
  const close = () => $("#ov").classList.remove("open");
  d.querySelector(".x").onclick = close; $("#dlgCancel").onclick = close;
  const msg = m => $("#dlgMsg").textContent = m || "";
  if(!ready) msg("I dati non sono ancora caricati: aspetta qualche secondo o ricarica la pagina.");
  $("#dlgSave").onclick = async () => {
    const b=$("#dlgSave"); b.disabled=true; msg("");
    try { const err = await onSave(msg); if(err){ msg(err); b.disabled=false; return; } close(); }
    catch(e){ b.disabled=false; msg("Salvataggio non riuscito: " + (e && e.message === "chiave" ? "il link che hai usato non è valido, chiedi a Matteo quello giusto." : (e && e.message || "controlla la connessione e riprova."))); }
  };
  if(onDelete){ let armed=false; $("#dlgDel").onclick = async () => {
    if(!armed){ armed=true; $("#dlgDel").textContent="Conferma eliminazione"; return; }
    try { const err = await onDelete(); if(err){ msg(err); return; } close(); toast("Eliminato."); } catch(e){ msg("Eliminazione non riuscita: " + (e && e.message || "")); }
  }; }
  setTimeout(()=>{ const f=d.querySelector("input,select,textarea"); if(f) f.focus(); }, 30);
}
$("#ov").addEventListener("click", e => { if(e.target.id==="ov") $("#ov").classList.remove("open"); });
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#ov").classList.remove("open"); });

/* ---------- render + dati ---------- */
let rq=0;
function render(){ cancelAnimationFrame(rq); rq=requestAnimationFrame(()=>{ ({budget:renderBudget, spese:renderSpese, produttori:renderProduttori, partner:renderPartner, calendario:renderCalendario})[view](); }); }

async function refresh(){
  try {
    const j = await apiGet();
    Object.keys(S).forEach(c => S[c] = (j.data && j.data[c]) || []);
    sheetUrl = j.sheetUrl || ""; ready = true; status(""); render();
    if(view==="calendario" && !EV.loaded) loadEventi();
  } catch(e){
    if(e && e.message==="chiave") status("Per entrare serve il link completo del gestionale (quello con la chiave). Chiedilo a Matteo.", true);
    else if(!ready) status("Non riesco a caricare i dati: controlla la connessione e ricarica la pagina.", true);
  }
}
route();
if(!KEY) status("Per entrare serve il link completo del gestionale (quello con la chiave). Chiedilo a Matteo.", true);
else if(API_URL.startsWith("__")) status("Il gestionale non è ancora collegato al foglio dati.", true);
else { status("Carico i dati…"); refresh(); setInterval(()=>{ if(!document.hidden && !$("#ov").classList.contains("open")) refresh(); }, 60000); document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); }); }
</script>
</body>
